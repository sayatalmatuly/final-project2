<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Калькулятор продуктивности — анализ распределения времени">
  <title>Калькулятор — TimeManager</title>
  <link rel="stylesheet" href="css/main.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
</head>
<body>
  <div id="header"></div>

  <main class="main">
    <section class="section container">
      <div class="section__header">
        <h1 class="section__title">Калькулятор продуктивности</h1>
        <p class="section__subtitle">Проанализируйте, как вы распределяете время в течение дня</p>
      </div>

      <div class="calculator-layout">
        <div class="card">
          <h3 style="margin-bottom: 1.125rem;">Время за день (часы)</h3>
          <form id="calculatorForm">
            <div class="form-group">
              <label class="form-label" for="hoursWork">Работа</label>
              <input type="number" id="hoursWork" class="form-input" min="0" max="24" step="0.5" value="0" placeholder="0">
            </div>
            <div class="form-group">
              <label class="form-label" for="hoursStudy">Учёба</label>
              <input type="number" id="hoursStudy" class="form-input" min="0" max="24" step="0.5" value="0" placeholder="0">
            </div>
            <div class="form-group">
              <label class="form-label" for="hoursRest">Отдых</label>
              <input type="number" id="hoursRest" class="form-input" min="0" max="24" step="0.5" value="0" placeholder="0">
            </div>
            <div class="form-group">
              <label class="form-label" for="hoursEntertainment">Развлечения</label>
              <input type="number" id="hoursEntertainment" class="form-input" min="0" max="24" step="0.5" value="0" placeholder="0">
            </div>
            <button type="submit" class="btn btn--primary">
              <i data-lucide="calculator"></i> Рассчитать
            </button>
          </form>
        </div>

        <div class="card">
          <h3 style="margin-bottom: 1.125rem;">Визуализация</h3>
          <div class="chart-container">
            <canvas id="productivityChart" width="300" height="300"></canvas>
            <div class="chart-legend" id="chartLegend">
              <div class="legend-item">
                <span class="legend-item__dot" style="background: #4a6741"></span>
                <span>Работа: 0 ч.</span>
              </div>
              <div class="legend-item">
                <span class="legend-item__dot" style="background: #c4a35a"></span>
                <span>Учёба: 0 ч.</span>
              </div>
              <div class="legend-item">
                <span class="legend-item__dot" style="background: #5e8c51"></span>
                <span>Отдых: 0 ч.</span>
              </div>
              <div class="legend-item">
                <span class="legend-item__dot" style="background: #b8956a"></span>
                <span>Развлечения: 0 ч.</span>
              </div>
            </div>
          </div>

          <div class="calculator-result" id="calculatorResult">
            <p class="calculator-result__text">Введите данные и нажмите «Рассчитать» для получения анализа.</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="footer"></div>

  <script src="js/app.js"></script>
</body>
</html>
