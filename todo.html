<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Планировщик задач — To-Do List с категориями и приоритетами">
  <title>Задачи — TimeManager</title>
  <link rel="stylesheet" href="css/main.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
</head>
<body>
  <div id="header"></div>

  <main class="main">
    <section class="section container">
      <div class="section__header">
        <h1 class="section__title">Планировщик задач</h1>
        <p class="section__subtitle">Создавайте, редактируйте и отслеживайте задачи с дедлайнами</p>
      </div>

      <div class="todo-stats">
        <div class="card stat-card">
          <div class="stat-card__value" id="statTotal">0</div>
          <div class="stat-card__label">Всего задач</div>
        </div>
        <div class="card stat-card">
          <div class="stat-card__value" id="statActive">0</div>
          <div class="stat-card__label">Активных</div>
        </div>
        <div class="card stat-card">
          <div class="stat-card__value" id="statDone">0</div>
          <div class="stat-card__label">Выполнено</div>
        </div>
      </div>

      <div class="todo-layout">
        <aside class="todo-form">
          <div class="card">
            <h3 style="margin-bottom: 1.125rem;">Новая задача</h3>
            <form id="todoForm">
              <div class="form-group">
                <label class="form-label" for="taskTitle">Название задачи</label>
                <input type="text" id="taskTitle" class="form-input" placeholder="Что нужно сделать?" required>
              </div>

              <div class="form-row">
                <div class="form-group">
                  <label class="form-label" for="taskCategory">Категория</label>
                  <select id="taskCategory" class="form-select">
                    <option value="work">Работа</option>
                    <option value="study">Учёба</option>
                    <option value="rest">Отдых</option>
                    <option value="sport">Спорт</option>
                  </select>
                </div>
                <div class="form-group">
                  <label class="form-label" for="taskPriority">Приоритет</label>
                  <select id="taskPriority" class="form-select">
                    <option value="low">Низкий</option>
                    <option value="medium">Средний</option>
                    <option value="high">Высокий</option>
                  </select>
                </div>
              </div>

              <div class="form-group">
                <label class="form-label" for="taskDeadline">Дедлайн (необязательно)</label>
                <input type="datetime-local" id="taskDeadline" class="form-input">
              </div>

              <div class="btn-group">
                <button type="submit" class="btn btn--primary">
                  <i data-lucide="plus"></i> Добавить
                </button>
              </div>
            </form>
          </div>
        </aside>

        <div class="todo-content">
          <div class="tabs">
            <button class="tab tab--active" id="tabActive">Активные</button>
            <button class="tab" id="tabCompleted">Выполненные</button>
          </div>

          <div id="activePanel">
            <div class="todo-list" id="taskList"></div>
          </div>

          <div id="completedPanel" class="sr-only">
            <div class="todo-list" id="completedList"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="footer"></div>

  <script src="js/app.js"></script>
</body>
</html>
